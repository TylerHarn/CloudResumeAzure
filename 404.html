<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 – Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
    }

    .code {
      font-size: 7rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -4px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #4576d2;
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }

    p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    a.btn {
      display: inline-block;
      padding: 0.65rem 1.75rem;
      background: #4576d2;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    a.btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="divider"></div>
    <h1>Error: Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a class="btn" href="/">Go Back To My Resume</a>
  </div>
</body>
</html>
